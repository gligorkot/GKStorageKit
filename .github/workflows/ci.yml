name: CI

on: pull_request

jobs:
  pod-lint:
    name: Pod lint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Bundle install
        run: bundle install

      - name: Set up XCode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

  test-no-iOS-host-15:
    name: Run swift tests that don't require iOS host on MacOS 15
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up XCode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Run tests that don't require iOS host
        run: swift test -c debug -Xswiftc -enable-testing
        shell: bash

  test-keychain-iOS-host-15-XCode16:
    name: Run swift tests that require keychain entitlement on XCode 16
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up XCode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Run tests that require iOS host for keychain entitlement
        run: xcodebuild -project SecureStorageTestsHostApp/SecureStorageTestsHostApp.xcodeproj -scheme SecureStorageTestsHostApp -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.2" test
        shell: bash
