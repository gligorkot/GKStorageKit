name: CI

on: pull_request

jobs:
  test-no-iOS-host-26:
    name: Run swift tests that don't require iOS host on MacOS 26
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up XCode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Run tests that don't require iOS host
        run: swift test -c debug -Xswiftc -enable-testing
        shell: bash

  test-keychain-iOS-host-26-XCode16:
    name: Run swift tests that require keychain entitlement on XCode 26
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up XCode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Run tests that require iOS host for keychain entitlement
        run: xcodebuild -project SecureStorageTestsHostApp/SecureStorageTestsHostApp.xcodeproj -scheme SecureStorageTestsHostApp -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2" test
        shell: bash
